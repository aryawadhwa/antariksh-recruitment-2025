<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Antariksh - Recruitment 2025</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --purple-glow: 167, 139, 250;
      --purple-600: 139, 92, 246;
      --purple-700: 109, 40, 217;
    }
    body {
      font-family: 'Exo 2', sans-serif;
      background: #000;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }
    /* Starfield Background */
    .starfield::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #eee, transparent),
        radial-gradient(2px 2px at 40px 70px, #fff, transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
        radial-gradient(2px 2px at 160px 120px, #ddd, transparent);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: starfield 60s linear infinite;
      pointer-events: none;
    }
    @keyframes starfield {
      from { transform: translateY(0); }
      to { transform: translateY(-200px); }
    }
    /* Shooting Stars */
    .shooting-star {
      position: fixed;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.8);
      z-index: -1;
      opacity: 0;
      animation: shoot linear infinite;
      pointer-events: none;
    }
    @keyframes shoot {
      0%, 8% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      12% { opacity: 1; }
      70% { opacity: 1; transform: translate(-500px, 500px) scale(1); }
      100% { opacity: 0; transform: translate(-600px, 600px) scale(0.3); }
    }
    .shooting-star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; animation-duration: 3.2s; }
    .shooting-star:nth-child(2) { top: 25%; left: 90%; animation-delay: 2.1s; animation-duration: 4s; }
    .shooting-star:nth-child(3) { top: 8%; left: 70%; animation-delay: 4.3s; animation-duration: 3.5s; }
    .shooting-star:nth-child(4) { top: 35%; left: 78%; animation-delay: 6.5s; animation-duration: 3s; }
    .shooting-star:nth-child(5) { top: 18%; left: 65%; animation-delay: 8.7s; animation-duration: 4.2s; }
    /* Closed Card */
    .closed-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 680px;
      width: 100%;
      z-index: 10;
    }
    /* Image Banner */
    .banner {
      padding: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }
    .banner img {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      object-position: center;
      background: #000;
      display: block;
    }
    /* Message Styling */
    .closed-message {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .highlight {
      background: linear-gradient(to right, rgb(var(--purple-700)), rgb(var(--purple-600)));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    .location {
      background: rgba(109, 40, 217, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 1rem;
    }
  </style>
</head>
<body class="starfield">
  <!-- Shooting Stars -->
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <!-- Closed Notice Card -->
  <div class="closed-card">
    <div class="bg-gradient-to-r from-purple-700 to-indigo-600 h-1"></div>
    
    <!-- IMAGE BANNER -->
    <div class="banner" role="banner" aria-label="Team Antariksh Recruitment 2025">
      <img
        src="https://res.cloudinary.com/dcxor5fht/image/upload/v1762617150/WhatsApp_Image_2025-11-08_at_21.20.36_nxtikr.jpg"
        alt="Team Antariksh Recruitment 2025"
        loading="lazy"
      />
    </div>

    <!-- Clean & Updated Closed Message with Location -->
    <div class="p-6 space-y-6 text-center">
      <h1 class="text-3xl md:text-4xl font-bold">
        <span class="highlight">Form Closed</span>
      </h1>
      
      <div class="closed-message max-w-2xl mx-auto opacity-90">
        <p>
          The online registration form is now officially <strong>closed</strong>.
        </p>
        <p class="mt-4">
          But if you want to be a part of this <strong class="highlight">amazing family</strong>, we have <strong>on spot registrations</strong>!
        </p>
        <p class="mt-6 text-lg">
          <strong>Come on 17th and 20th November by 4:30 PM</strong>
        </p>
        <p class="mt-3 text-sm opacity-70">
          Don't miss your chance to join Team Antariksh!
        </p>
      </div>

      <!-- Location Highlight -->
      <div class="location text-lg">
        📍 <strong>Location:</strong> IEM Seminar Hall
      </div>

      <div class="pt-4">
        <a href="https://www.instagram.com/teamantarikshofficial?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" 
           target="_blank" 
           class="inline-block bg-gradient-to-r from-purple-700 to-purple-600 text-white font-semibold py-3 px-8 rounded-lg hover:from-purple-800 hover:to-purple-700 transition-all shadow-lg transform hover:scale-105 transition-transform">
          Follow us on Instagram
        </a>
      </div>
    </div>
  </div>
</body>
</html>
